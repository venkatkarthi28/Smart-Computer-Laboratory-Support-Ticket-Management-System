# ---------- Application ----------
spring.application.name=lab-support
server.port=${PORT:8080}

# ---------- Load secrets from the .env file (if it exists) ----------
spring.config.import=optional:file:.env[.properties]

# ---------- MySQL connection ----------
# DB_URL is optional: without it the local database lab_support_db is used.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lab_support_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:labsupport_user}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# "update" creates/updates tables automatically from our entity classes (development only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Demo data (Phase 7) ----------
# Password for the demo accounts admin@college.com, technician@college.com, student@college.com.
# Put SEED_PASSWORD=... in your .env file. If it is empty, demo users are not created.
app.seed.password=${SEED_PASSWORD:}


# ---------- JWT (Phase 9) ----------
# JWT_SECRET must be in your .env file (at least 32 characters). Never commit it.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480
