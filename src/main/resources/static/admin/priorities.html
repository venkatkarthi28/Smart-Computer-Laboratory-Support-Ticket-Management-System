<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priorities - Lab Support</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet"></head><body>
<div id="navbar"></div>
<div class="container-fluid px-4 pb-5" id="page"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script><script src="/js/admin-crud.js"></script>
<script>
  Auth.require("ADMIN").then(user => {
    UI.renderNavbar(user);
    AdminCrud.init({
      title: "Priorities", subtitle: "How urgent a ticket is, and how many hours the SLA allows. Changes affect new tickets only.", singular: "priority", plural: "priorities",
      base: "/api/admin/priorities", searchPlaceholder: "Search priorities", emptyText: "No priorities yet.",
      fetch: async () => ({ items: await Api.get("/api/priorities") }),
      match: (p, q) => p.name.toLowerCase().includes(q),
      itemName: p => "priority " + p.name,
      columns: [
        { label: "Priority", render: p => UI.priorityBadge(p.name) },
        { label: "SLA target", render: p => p.slaHours + (p.slaHours === 1 ? " hour" : " hours") },
        { label: "Severity level", render: p => p.severityLevel }
      ],
      fields: [
        { name: "name", label: "Name", required: true, maxlength: 30, half: true },
        { name: "slaHours", label: "SLA target (hours)", type: "number", required: true, min: 1, max: 720, half: true, help: "1 to 720 hours." },
        { name: "severityLevel", label: "Severity level", type: "number", required: true, min: 1, max: 10, half: true, help: "Must be unique. Higher means more urgent." }
      ]
    });
  });
</script></body></html>
