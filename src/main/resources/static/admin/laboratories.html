<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratories - Lab Support</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet"></head><body>
<div id="navbar"></div>
<div class="container-fluid px-4 pb-5" id="page"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script><script src="/js/admin-crud.js"></script>
<script>
  Auth.require("ADMIN").then(user => {
    UI.renderNavbar(user);
    AdminCrud.init({
      title: "Laboratories", subtitle: "Manage laboratories and the technicians who work in each one.", singular: "laboratory", plural: "laboratories",
      base: "/api/admin/laboratories", searchPlaceholder: "Search laboratories", emptyText: "No laboratories yet.",
      fetch: async () => ({ items: await Api.get("/api/laboratories") }),
      match: (l, q) => (l.name + " " + (l.location || "") + " " + (l.description || "")).toLowerCase().includes(q),
      itemName: l => l.name,
      columns: [
        { label: "Laboratory", render: l => "<strong>" + UI.esc(l.name) + "</strong>" },
        { label: "Location / details", render: l => UI.esc(l.location || "-") + (l.description ? '<div class="small text-muted">' + UI.esc(l.description) + "</div>" : "") },
        { label: "Computers", render: l => '<a class="text-decoration-none" href="/admin/computers.html?labId=' + l.id + '">' + l.computerCount + "</a>" },
        { label: "Technicians", render: l => l.technicians.length ? l.technicians.map(t => '<span class="badge status-ASSIGNED me-1">' + UI.esc(t.fullName) + "</span>").join("") : '<span class="text-muted">None assigned</span>' }
      ],
      fields: [
        { name: "name", label: "Laboratory name", required: true, maxlength: 100 },
        { name: "location", label: "Location", maxlength: 150 },
        { name: "description", label: "Description", type: "textarea", maxlength: 255 }
      ],
      actions: [{ key: "techs", label: "Technicians", run: async (lab, ctx) => {
        let techs;
        try { techs = (await Api.get("/api/admin/technicians?page=0&size=100")).content.filter(t => t.active); }
        catch (e) { ctx.notify("danger", UI.esc(e.message)); return; }
        const mine = new Set(lab.technicians.map(t => t.id));
        ctx.dialog({
          title: "Technicians in " + lab.name,
          body: techs.length ? '<p class="text-muted">Tick the technicians who work in this laboratory. They will see its unassigned tickets.</p>' +
            techs.map(t => '<div class="form-check mb-2"><input class="form-check-input tech-box" type="checkbox" id="tech' + t.id + '" value="' + t.id + '"' +
              (mine.has(t.id) ? " checked" : "") + '><label class="form-check-label" for="tech' + t.id + '">' + UI.esc(t.fullName) + ' <span class="text-muted small">' + UI.esc(t.email) + "</span></label></div>").join("")
            : '<div class="text-muted">There are no active technicians yet. Add one on the Technicians page first.</div>',
          saveLabel: techs.length ? "Save technicians" : null,
          onSave: techs.length ? async () => {
            const ids = [...document.querySelectorAll(".tech-box:checked")].map(b => Number(b.value));
            await Api.put("/api/admin/laboratories/" + lab.id + "/technicians", { technicianIds: ids });
            ctx.notify("success", "Technicians updated."); ctx.reload();
          } : null
        });
      } }]
    });
  });
</script></body></html>
