<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories - Lab Support</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet"></head><body>
<div id="navbar"></div>
<div class="container-fluid px-4 pb-5" id="page"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script><script src="/js/admin-crud.js"></script>
<script>
  Auth.require("ADMIN").then(user => {
    UI.renderNavbar(user);
    AdminCrud.init({
      title: "Categories", subtitle: "Problem types students choose when they raise a ticket.", singular: "category", plural: "categories",
      base: "/api/admin/categories", searchPlaceholder: "Search categories", emptyText: "No categories yet.",
      fetch: async () => ({ items: await Api.get("/api/admin/categories") }),
      match: (c, q) => (c.name + " " + (c.description || "")).toLowerCase().includes(q),
      itemName: c => "category " + c.name,
      columns: [
        { label: "Name", render: c => "<strong>" + UI.esc(c.name) + "</strong>" },
        { label: "Description", render: c => UI.esc(c.description || "-") },
        { label: "Status", render: c => c.active ? AdminCrud.badge("Active", "good") : AdminCrud.badge("Inactive", "muted") }
      ],
      fields: [
        { name: "name", label: "Name", required: true, maxlength: 50, help: "Saved in capitals; spaces become underscores (for example OPERATING_SYSTEM)." },
        { name: "description", label: "Description", type: "textarea", maxlength: 255 },
        { name: "active", label: "Active (students can choose this category)", type: "checkbox", default: true }
      ]
    });
  });
</script></body></html>
