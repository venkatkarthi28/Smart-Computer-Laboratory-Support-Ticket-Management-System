<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tickets - Lab Support</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet"></head><body>
<div id="navbar"></div>
<div class="container-fluid px-4 pb-5">
  <h3 class="page-title mb-3">All tickets</h3>
  <div class="card mb-3"><div class="card-body"><div class="row g-2">
    <div class="col-6 col-md-2"><select id="fStatus" class="form-select"><option value="">All statuses</option>
      <option>OPEN</option><option>ASSIGNED</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option><option>REOPENED</option></select></div>
    <div class="col-6 col-md-2"><select id="fLab" class="form-select"><option value="">All labs</option></select></div>
    <div class="col-6 col-md-2"><select id="fCategory" class="form-select"><option value="">All categories</option></select></div>
    <div class="col-6 col-md-2"><select id="fPriority" class="form-select"><option value="">All priorities</option></select></div>
    <div class="col-6 col-md-2"><select id="fTech" class="form-select"><option value="">All technicians</option></select></div>
    <div class="col-6 col-md-2"><button class="btn btn-outline-secondary w-100" id="reset">Reset filters</button></div>
  </div></div></div>
  <div id="alert"></div>
  <div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
    <thead><tr><th>#</th><th>Lab / Computer</th><th>Category</th><th>Priority</th><th>Status</th><th>Student</th><th>Technician</th><th>Created</th><th>SLA deadline</th></tr></thead>
    <tbody id="rows"></tbody></table></div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center"><span class="small text-muted" id="count"></span>
      <div class="btn-group"><button class="btn btn-sm btn-outline-secondary" id="prev">Previous</button><button class="btn btn-sm btn-outline-secondary" id="next">Next</button></div></div></div>
</div>
<div class="modal fade" id="tModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="mTitle"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><div id="mAlert"></div><div id="mBody"></div></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let page = 0, lastPage = true, techs = [], modal = null;
  const opts = (list, label) => list.map(x => '<option value="' + x.id + '">' + UI.esc(label(x)) + "</option>").join("");
  const row = (k, v) => '<div class="row mb-1"><div class="col-sm-3 text-muted">' + k + '</div><div class="col-sm-9">' + v + "</div></div>";
  const FILTERS = { status: "fStatus", labId: "fLab", categoryId: "fCategory", priorityId: "fPriority", technicianId: "fTech" };

  async function load() {
    const q = new URLSearchParams({ page, size: 10 });
    Object.entries(FILTERS).forEach(([k, el]) => { if ($(el).value) q.set(k, $(el).value); });
    try {
      const p = await Api.get("/api/admin/tickets?" + q);
      lastPage = p.last;
      $("rows").innerHTML = p.content.length ? p.content.map(t =>
        '<tr class="clickable" data-id="' + t.id + '"><td>#' + t.id + "</td><td>" + UI.esc(t.laboratoryName) + " / " + UI.esc(t.computerCode) +
        "</td><td>" + UI.esc(t.categoryName) + "</td><td>" + UI.priorityBadge(t.priorityName) + "</td><td>" + UI.statusBadge(t.status) + UI.slaBadge(t.slaBreached) +
        "</td><td>" + UI.esc(t.studentName) + "</td><td>" + UI.esc(t.assignedTechnicianName || "-") + "</td><td>" + UI.dateTime(t.createdAt) +
        "</td><td>" + UI.dateTime(t.slaDeadline) + "</td></tr>").join("")
        : '<tr><td colspan="9" class="text-muted p-3">No tickets match these filters.</td></tr>';
      $("rows").querySelectorAll("tr.clickable").forEach(tr => tr.onclick = () => openTicket(tr.dataset.id));
      $("count").textContent = p.totalElements + " ticket(s) - page " + (p.page + 1) + " of " + Math.max(p.totalPages, 1);
      $("prev").disabled = page === 0; $("next").disabled = lastPage;
    } catch (e) { UI.showError("alert", e); }
  }

  async function openTicket(id) {
    UI.alertBox("mAlert", "", "");
    $("mBody").innerHTML = "Loading..."; modal.show();
    try {
      const [t, h] = await Promise.all([Api.get("/api/tickets/" + id), Api.get("/api/tickets/" + id + "/history")]);
      $("mTitle").innerHTML = "Ticket #" + t.id + " " + UI.statusBadge(t.status) + UI.slaBadge(t.slaBreached);
      const canAssign = ["OPEN", "ASSIGNED", "IN_PROGRESS", "REOPENED"].includes(t.status);
      const current = t.assignedTechnician ? t.assignedTechnician.id : "";
      $("mBody").innerHTML =
        row("Student", UI.esc(t.student ? t.student.fullName : "-")) + row("Lab / PC", UI.esc(t.laboratoryName) + " / " + UI.esc(t.computerCode)) +
        row("Category", UI.esc(t.categoryName)) + row("Priority", UI.priorityBadge(t.priorityName)) +
        row("Problem", UI.esc(t.description).replace(/\n/g, "<br>")) +
        row("Technician", UI.esc(t.assignedTechnician ? t.assignedTechnician.fullName : "Not assigned")) +
        row("Created", UI.dateTime(t.createdAt)) + row("SLA deadline", UI.dateTime(t.slaDeadline)) +
        (t.diagnosis ? row("Diagnosis", UI.esc(t.diagnosis)) : "") + (t.resolutionNotes ? row("Resolution", UI.esc(t.resolutionNotes)) : "") +
        (t.resolvedAt ? row("Resolution time", UI.minutes(t.resolutionMinutes)) : "") +
        (t.feedback ? row("Feedback", t.feedback.rating + "/5 " + UI.esc(t.feedback.comments || "")) : "") +
        (canAssign ? '<hr><div class="input-group"><span class="input-group-text">' + (t.assignedTechnician ? "Reassign to" : "Assign to") + '</span>' +
          '<select id="assignTech" class="form-select">' + (current ? "" : '<option value="">Choose a technician</option>') + opts(techs, u => u.fullName) +
          '</select><button class="btn btn-primary" id="assignBtn">Assign</button></div>' : "") +
        '<hr><div class="fw-semibold mb-2">Status history</div><ul class="list-group">' + h.map(x => '<li class="list-group-item small">' +
          (x.fromStatus ? UI.statusBadge(x.fromStatus) + " &rarr; " : "") + UI.statusBadge(x.toStatus) + " " + UI.esc(x.remark || "") +
          '<div class="text-muted">' + UI.esc(x.changedByName) + ", " + UI.dateTime(x.changedAt) + "</div></li>").join("") + "</ul>";
      if (canAssign) {
        if (current) $("assignTech").value = current;
        $("assignBtn").onclick = async () => {
          UI.alertBox("mAlert", "", "");
          try {
            await Api.put("/api/admin/tickets/" + id + "/assign", { technicianId: Number($("assignTech").value) || null });
            await openTicket(id); load();
          } catch (e) { UI.showError("mAlert", e); }
        };
      }
    } catch (e) { UI.showError("mAlert", e); }
  }

  Auth.require("ADMIN").then(async user => {
    UI.renderNavbar(user);
    modal = new bootstrap.Modal($("tModal"));
    try {
      const [labs, cats, pris, techPage] = await Promise.all([Api.get("/api/laboratories"), Api.get("/api/admin/categories"),
        Api.get("/api/priorities"), Api.get("/api/admin/technicians?size=100")]);
      techs = techPage.content.filter(u => u.active);
      $("fLab").insertAdjacentHTML("beforeend", opts(labs, l => l.name));
      $("fCategory").insertAdjacentHTML("beforeend", opts(cats, c => c.name));
      $("fPriority").insertAdjacentHTML("beforeend", opts(pris, p => p.name));
      $("fTech").insertAdjacentHTML("beforeend", opts(techs, u => u.fullName));
    } catch (e) { UI.showError("alert", e); }
    Object.values(FILTERS).forEach(el => $(el).onchange = () => { page = 0; load(); });
    $("reset").onclick = () => { Object.values(FILTERS).forEach(el => $(el).value = ""); page = 0; load(); };
    $("prev").onclick = () => { page--; load(); }; $("next").onclick = () => { page++; load(); };
    load();
  });
</script></body></html>
