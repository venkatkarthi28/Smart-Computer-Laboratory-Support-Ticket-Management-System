<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
  <title>Login - Smart Lab Support</title>
</head>
<body>
<div class="auth-split">
  <section class="auth-hero">
    <i class="bi bi-pc-display-horizontal logo"></i>
    <h1>Smart Computer Laboratory</h1>
    <p class="lead mb-0">IT Support &amp; Ticket Management System</p>
    <ul class="hero-list">
      <li><i class="bi bi-ticket-detailed"></i>Raise IT issues easily</li>
      <li><i class="bi bi-headset"></i>Get quick support</li>
      <li><i class="bi bi-geo-alt"></i>Track your tickets</li>
      <li><i class="bi bi-hand-thumbs-up"></i>Keep the lab running smoothly</li>
    </ul>
    <div class="hero-monitors" aria-hidden="true"><i class="bi bi-pc-display"></i><i class="bi bi-pc-display"></i><i class="bi bi-pc-display"></i><i class="bi bi-pc-display"></i><i class="bi bi-pc-display"></i></div>
  </section>
  <section class="auth-panel"><div class="auth-box">
    <h2>Welcome Back</h2>
    <p class="text-center text-muted mb-4">Log in to your account</p>
    <div id="alert"></div>
    <form id="loginForm" novalidate>
      <div class="mb-3"><label class="form-label" for="email">Email</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="email" class="form-control" id="email" placeholder="Email" autocomplete="username" required></div></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password" required>
          <button class="btn btn-outline-secondary" type="button" id="togglePw" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
      <button class="btn btn-primary w-100 py-2" id="submitBtn" type="submit">Log in</button>
    </form>
    <div class="or-line">OR</div>
    <a class="btn btn-outline-primary w-100 py-2" href="/register.html"><i class="bi bi-person-plus me-1"></i>Register (Student)</a>
    <div class="small text-muted mt-4 mb-1">Demo accounts: select one, then enter its password.</div>
    <div class="d-flex flex-wrap gap-2">
      <button type="button" class="btn btn-outline-secondary btn-sm demo" data-email="student@college.com">Student</button>
      <button type="button" class="btn btn-outline-secondary btn-sm demo" data-email="technician@college.com">Technician</button>
      <button type="button" class="btn btn-outline-secondary btn-sm demo" data-email="admin@college.com">Admin</button>
    </div>
  </div></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script>
  if (new URLSearchParams(location.search).get("expired")) {
    UI.alertBox("alert", "warning", "Your session has expired. Please log in again.");
  }

  // Already logged in with a valid token? Go straight to the dashboard.
  (async () => {
    if (!Api.getToken()) return;
    try {
      const me = await Api.request("GET", "/api/auth/me", null, { redirect401: false });
      window.location.replace(Auth.homeFor(me.role));
    } catch (e) { Api.clearSession(); }
  })();

  document.getElementById("togglePw").addEventListener("click", () => {
    const p = document.getElementById("password"), show = p.type === "password";
    p.type = show ? "text" : "password";
    document.querySelector("#togglePw i").className = "bi " + (show ? "bi-eye-slash" : "bi-eye");
  });

  document.querySelectorAll(".demo").forEach(b => b.addEventListener("click", () => {
    document.getElementById("email").value = b.dataset.email;
    document.getElementById("password").focus();
  }));

  document.getElementById("loginForm").addEventListener("submit", async ev => {
    ev.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) { UI.alertBox("alert", "danger", "Enter your email and password."); return; }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    try {
      const user = await Auth.login(email, password);
      window.location.href = Auth.homeFor(user.role);
    } catch (err) {
      UI.showError("alert", err);
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
