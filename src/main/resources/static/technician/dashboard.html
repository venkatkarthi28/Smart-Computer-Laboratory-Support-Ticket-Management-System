<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Technician Dashboard - Lab Support</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container pb-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <h3 class="page-title mb-0" id="welcome">Dashboard</h3>
    <a class="btn btn-primary" href="/technician/tickets.html">Open my tickets</a>
  </div>
  <div id="alert"></div>
  <div class="row g-3" id="stats"></div>
  <p class="text-muted mt-4 small">
    "Pending" = assigned to you but work not started. Average resolution time is measured from ticket creation to resolution.
  </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script>
  Auth.require("TECHNICIAN").then(async user => {
    UI.renderNavbar(user);
    document.getElementById("welcome").textContent = "Welcome, " + user.fullName;
    try {
      const d = await Api.get("/api/technician/dashboard");
      document.getElementById("stats").innerHTML =
        UI.statCard("Assigned tickets", d.assignedTickets, "dark") +
        UI.statCard("Pending", d.pendingTickets, "blue") +
        UI.statCard("In progress", d.inProgressTickets, "orange") +
        UI.statCard("Resolved", d.resolvedTickets, "green") +
        UI.statCard("SLA breached", d.slaBreachedTickets, "red") +
        UI.statCard("Avg resolution time", UI.minutes(d.averageResolutionMinutes), "gray");
    } catch (err) { UI.showError("alert", err); }
  });
</script>
</body>
</html>
