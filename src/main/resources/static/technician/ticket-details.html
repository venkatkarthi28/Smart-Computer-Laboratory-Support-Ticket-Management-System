<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Details - Lab Support</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet"></head><body>
<div id="navbar"></div>
<div class="container pb-5" style="max-width:1000px">
  <a href="/technician/tickets.html" class="small">&larr; Tickets</a>
  <h3 class="page-title my-2" id="title">Ticket</h3>
  <div id="alert"></div>
  <div id="actions"></div>
  <div class="row g-3">
    <div class="col-lg-7">
      <div class="card mb-3"><div class="card-header bg-white fw-semibold">Details</div><div class="card-body" id="details"></div></div>
      <div class="card mb-3"><div class="card-header bg-white fw-semibold">Comments</div><div class="card-body">
        <div id="comments" class="mb-3"></div>
        <div id="commentForm" class="input-group"><input id="commentText" class="form-control" maxlength="1000" placeholder="Write a comment...">
          <button class="btn btn-outline-primary" id="commentBtn">Send</button></div></div></div>
    </div>
    <div class="col-lg-5">
      <div class="card mb-3"><div class="card-header bg-white fw-semibold">Status history</div><ul class="list-group list-group-flush" id="history"></ul></div>
      <div class="card"><div class="card-header bg-white fw-semibold">Earlier repairs on this computer</div><ul class="list-group list-group-flush" id="maint"></ul></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const id = new URLSearchParams(location.search).get("id");
  const row = (k, v) => '<div class="row mb-2"><div class="col-sm-4 text-muted">' + k + '</div><div class="col-sm-8">' + v + "</div></div>";
  let me = null;

  async function act(call) {
    UI.alertBox("alert", "", "");
    try { await call(); await load(); } catch (e) { UI.showError("alert", e); }
  }

  function actions(t) {
    const box = $("actions");
    const mine = t.assignedTechnician && t.assignedTechnician.id === me.id;
    box.innerHTML = "";
    if (!t.assignedTechnician && t.status === "OPEN") {
      box.innerHTML = '<div class="alert alert-primary d-flex justify-content-between align-items-center">Nobody has accepted this ticket yet.' +
        '<button class="btn btn-primary btn-sm" id="accept">Accept ticket</button></div>';
      $("accept").onclick = () => act(() => Api.put("/api/tickets/" + id + "/accept"));
    } else if (mine && (t.status === "ASSIGNED" || t.status === "REOPENED")) {
      const again = t.status === "REOPENED";
      box.innerHTML = '<div class="alert ' + (again ? "alert-warning" : "alert-primary") + ' d-flex justify-content-between align-items-center">' +
        (again ? "The student says the problem is not solved. Check the history for the reason." : "This ticket is assigned to you.") +
        '<button class="btn btn-primary btn-sm" id="start">' + (again ? "Resume work" : "Start work") + "</button></div>";
      $("start").onclick = () => act(() => Api.put("/api/tickets/" + id + "/start"));
    } else if (mine && t.status === "IN_PROGRESS") {
      box.innerHTML = '<div class="card mb-3 border-success"><div class="card-header bg-white fw-semibold">Resolve this ticket</div><div class="card-body">' +
        '<label class="form-label">Diagnosis (what was wrong?)</label><textarea id="diag" class="form-control mb-2" rows="2" maxlength="2000"></textarea>' +
        '<label class="form-label">Resolution (what did you do?)</label><textarea id="resol" class="form-control mb-2" rows="2" maxlength="2000"></textarea>' +
        '<button class="btn btn-success" id="resolve">Mark as resolved</button></div></div>';
      $("resolve").onclick = () => act(() => Api.put("/api/tickets/" + id + "/resolve",
        { diagnosis: $("diag").value.trim(), resolutionNotes: $("resol").value.trim() }));
    } else if (t.status === "RESOLVED") {
      box.innerHTML = '<div class="alert alert-success">Resolved. Waiting for the student to confirm.</div>';
    }
  }

  async function load() {
    try {
      const [t, history, comments] = await Promise.all([Api.get("/api/tickets/" + id),
        Api.get("/api/tickets/" + id + "/history"), Api.get("/api/tickets/" + id + "/comments")]);
      $("title").innerHTML = "Ticket #" + t.id + " " + UI.statusBadge(t.status) + UI.slaBadge(t.slaBreached);
      actions(t);
      $("details").innerHTML =
        row("Student", UI.esc(t.student ? t.student.fullName : "-")) +
        row("Laboratory / PC", UI.esc(t.laboratoryName) + " / " + UI.esc(t.computerCode)) +
        row("Category", UI.esc(t.categoryName)) + row("Priority", UI.priorityBadge(t.priorityName)) +
        row("Problem", UI.esc(t.description).replace(/\n/g, "<br>")) +
        row("Technician", UI.esc(t.assignedTechnician ? t.assignedTechnician.fullName : "Not assigned")) +
        row("Created", UI.dateTime(t.createdAt)) + row("SLA deadline", UI.dateTime(t.slaDeadline)) +
        (t.slaRemainingMinutes !== null && t.slaRemainingMinutes !== undefined
          ? row("SLA remaining", t.slaRemainingMinutes >= 0 ? UI.minutes(t.slaRemainingMinutes) : "Overdue by " + UI.minutes(-t.slaRemainingMinutes)) : "") +
        (t.diagnosis ? row("Diagnosis", UI.esc(t.diagnosis)) : "") +
        (t.resolutionNotes ? row("Resolution", UI.esc(t.resolutionNotes)) : "") +
        (t.resolvedAt ? row("Resolved", UI.dateTime(t.resolvedAt) + " (took " + UI.minutes(t.resolutionMinutes) + ")") : "") +
        (t.reopenCount ? row("Reopened", t.reopenCount + " time(s)") : "") +
        (t.feedback ? row("Feedback", t.feedback.rating + "/5 " + UI.esc(t.feedback.comments || "")) : "");
      $("history").innerHTML = history.map(h => '<li class="list-group-item small">' + (h.fromStatus ? UI.statusBadge(h.fromStatus) + " &rarr; " : "") +
        UI.statusBadge(h.toStatus) + "<div>" + UI.esc(h.remark || "") + '</div><div class="text-muted">' + UI.esc(h.changedByName) + ", " + UI.dateTime(h.changedAt) + "</div></li>").join("");
      $("comments").innerHTML = comments.length ? comments.map(c => '<div class="mb-2"><strong>' + UI.esc(c.authorName) +
        ' <span class="badge bg-light text-dark">' + c.authorRole + '</span></strong> <span class="text-muted small">' + UI.dateTime(c.createdAt) +
        "</span><div>" + UI.esc(c.message) + "</div></div>").join("") : '<div class="text-muted small">No comments yet.</div>';
      $("commentForm").classList.toggle("d-none", t.status === "CLOSED");
      loadMaintenance(t);
    } catch (e) { UI.showError("alert", e); }
  }

  async function loadMaintenance(t) {
    try {
      const list = (await Api.get("/api/computers/" + t.computerId + "/maintenance-history")).filter(m => m.ticketId !== t.id);
      $("maint").innerHTML = list.length ? list.map(m => '<li class="list-group-item small"><strong>' + UI.esc(m.categoryName) + "</strong> - " +
        UI.dateTime(m.resolvedAt) + "<div>" + UI.esc(m.issueSummary) + '</div><div class="text-muted">Fix: ' + UI.esc(m.resolutionSummary) +
        " (" + UI.esc(m.technicianName) + ")</div></li>").join("")
        : '<li class="list-group-item small text-muted">No earlier repairs recorded.</li>';
    } catch (e) { $("maint").innerHTML = '<li class="list-group-item small text-muted">History not available.</li>'; }
  }

  Auth.require("TECHNICIAN").then(user => {
    me = user;
    UI.renderNavbar(user);
    if (!id) { UI.alertBox("alert", "danger", "No ticket selected."); return; }
    $("commentBtn").onclick = () => act(async () => {
      await Api.post("/api/tickets/" + id + "/comments", { message: $("commentText").value.trim() });
      $("commentText").value = "";
    });
    load();
  });
</script></body></html>
