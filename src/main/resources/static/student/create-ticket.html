<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Ticket - Lab Support</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet"></head><body>
<div id="navbar"></div>
<div class="container pb-5" style="max-width:720px">
  <h3 class="page-title mb-3">Report a problem</h3>
  <div id="alert"></div>
  <div class="card"><div class="card-body">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">Laboratory</label><select id="lab" class="form-select"></select></div>
      <div class="col-md-6"><label class="form-label">Computer</label><select id="computer" class="form-select"></select></div>
      <div class="col-md-6"><label class="form-label">Category</label><select id="category" class="form-select"></select></div>
      <div class="col-md-6"><label class="form-label">Priority</label><select id="priority" class="form-select"></select></div>
      <div class="col-12"><label class="form-label">Describe the problem</label>
        <textarea id="description" class="form-control" rows="4" maxlength="2000" placeholder="At least 10 characters"></textarea></div>
      <div class="col-12"><div id="info" class="small text-muted"></div></div>
      <div class="col-12"><button id="submit" class="btn btn-primary">Raise ticket</button>
        <a href="/student/tickets.html" class="btn btn-link">Cancel</a></div>
    </div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const opts = (list, label) => list.map(x => '<option value="' + x.id + '">' + UI.esc(label(x)) + '</option>').join("");

  async function loadComputers() {
    $("computer").innerHTML = "<option>Loading...</option>";
    try {
      const p = await Api.get("/api/computers?labId=" + $("lab").value + "&size=100");
      $("computer").innerHTML = p.content.length ? opts(p.content, c => c.computerCode + " (" + c.status.replace("_", " ") + ")")
        : "<option value=''>No computers in this lab</option>";
    } catch (e) { UI.showError("alert", e); }
  }
  function showSla() {
    const p = window.priorities.find(x => String(x.id) === $("priority").value);
    $("info").textContent = p ? "Target resolution time for " + p.name + ": " + p.slaHours + " hour(s)." : "";
  }

  Auth.require("STUDENT").then(async user => {
    UI.renderNavbar(user);
    try {
      const [labs, cats, pris] = await Promise.all([Api.get("/api/laboratories"), Api.get("/api/categories"), Api.get("/api/priorities")]);
      window.priorities = pris;
      $("lab").innerHTML = opts(labs, l => l.name);
      $("category").innerHTML = opts(cats, c => c.name);
      $("priority").innerHTML = opts(pris, p => p.name);
      const medium = pris.find(p => p.name === "MEDIUM"); if (medium) $("priority").value = medium.id;
      showSla();
      if (labs.length) await loadComputers();
    } catch (e) { UI.showError("alert", e); }

    $("lab").addEventListener("change", loadComputers);
    $("priority").addEventListener("change", showSla);
    $("submit").addEventListener("click", async () => {
      UI.alertBox("alert", "", "");
      $("submit").disabled = true;
      try {
        const t = await Api.post("/api/tickets", {
          computerId: Number($("computer").value) || null, categoryId: Number($("category").value) || null,
          priorityId: Number($("priority").value) || null, description: $("description").value.trim()
        });
        window.location.href = "/student/ticket-details.html?id=" + t.id;
      } catch (e) { UI.showError("alert", e); $("submit").disabled = false; }
    });
  });
</script></body></html>
