<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Details - Lab Support</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet"></head><body>
<div id="navbar"></div>
<div class="container pb-5" style="max-width:960px">
  <a href="/student/tickets.html" class="small">&larr; My tickets</a>
  <h3 class="page-title my-2" id="title">Ticket</h3>
  <div id="alert"></div>
  <div id="actions"></div>
  <div class="row g-3">
    <div class="col-lg-7"><div class="card mb-3"><div class="card-header bg-white fw-semibold">Details</div><div class="card-body" id="details"></div></div>
      <div class="card"><div class="card-header bg-white fw-semibold">Comments</div><div class="card-body">
        <div id="comments" class="mb-3"></div>
        <div id="commentForm" class="input-group"><input id="commentText" class="form-control" maxlength="1000" placeholder="Write a comment...">
          <button class="btn btn-outline-primary" id="commentBtn">Send</button></div></div></div></div>
    <div class="col-lg-5"><div class="card"><div class="card-header bg-white fw-semibold">Status history</div>
      <ul class="list-group list-group-flush" id="history"></ul></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const id = new URLSearchParams(location.search).get("id");
  const row = (k, v) => '<div class="row mb-2"><div class="col-sm-4 text-muted">' + k + '</div><div class="col-sm-8">' + v + "</div></div>";

  async function act(call) {
    UI.alertBox("alert", "", "");
    try { await call(); await load(); } catch (e) { UI.showError("alert", e); }
  }

  function actions(t) {
    const box = $("actions");
    if (t.status === "RESOLVED") {
      box.innerHTML = '<div class="alert alert-success"><strong>Is your problem solved?</strong> The technician marked this ticket as resolved.' +
        '<div class="mt-2 d-flex flex-wrap gap-2"><button class="btn btn-success btn-sm" id="yes">Yes, solved</button>' +
        '<input id="reason" class="form-control form-control-sm w-auto" placeholder="If not, what is still wrong?" maxlength="500">' +
        '<button class="btn btn-outline-danger btn-sm" id="no">No, reopen</button></div></div>';
      $("yes").onclick = () => act(() => Api.put("/api/tickets/" + id + "/confirm"));
      $("no").onclick = () => act(() => Api.put("/api/tickets/" + id + "/reopen", { reason: $("reason").value.trim() || null }));
    } else if (t.status === "CLOSED" && !t.feedback) {
      box.innerHTML = '<div class="alert alert-info"><strong>Rate the support you received</strong>' +
        '<div class="mt-2 d-flex flex-wrap gap-2"><select id="rating" class="form-select form-select-sm w-auto">' +
        [5,4,3,2,1].map(n => "<option value=" + n + ">" + n + " star" + (n > 1 ? "s" : "") + "</option>").join("") + "</select>" +
        '<input id="fbText" class="form-control form-control-sm w-auto" placeholder="Comments (optional)" maxlength="1000">' +
        '<button class="btn btn-primary btn-sm" id="fb">Submit feedback</button></div></div>';
      $("fb").onclick = () => act(() => Api.post("/api/tickets/" + id + "/feedback",
        { rating: Number($("rating").value), comments: $("fbText").value.trim() || null }));
    } else box.innerHTML = "";
  }

  async function load() {
    try {
      const [t, history, comments] = await Promise.all([Api.get("/api/tickets/" + id),
        Api.get("/api/tickets/" + id + "/history"), Api.get("/api/tickets/" + id + "/comments")]);
      $("title").innerHTML = "Ticket #" + t.id + " " + UI.statusBadge(t.status) + UI.slaBadge(t.slaBreached);
      actions(t);
      $("details").innerHTML =
        row("Laboratory / PC", UI.esc(t.laboratoryName) + " / " + UI.esc(t.computerCode)) +
        row("Category", UI.esc(t.categoryName)) + row("Priority", UI.priorityBadge(t.priorityName)) +
        row("Problem", UI.esc(t.description).replace(/\n/g, "<br>")) +
        row("Technician", UI.esc(t.assignedTechnician ? t.assignedTechnician.fullName : "Not assigned yet")) +
        row("Created", UI.dateTime(t.createdAt)) + row("SLA deadline", UI.dateTime(t.slaDeadline)) +
        (t.slaRemainingMinutes !== null && t.slaRemainingMinutes !== undefined
          ? row("SLA remaining", t.slaRemainingMinutes >= 0 ? UI.minutes(t.slaRemainingMinutes) : "Overdue by " + UI.minutes(-t.slaRemainingMinutes)) : "") +
        (t.diagnosis ? row("Diagnosis", UI.esc(t.diagnosis)) : "") +
        (t.resolutionNotes ? row("Resolution", UI.esc(t.resolutionNotes)) : "") +
        (t.resolvedAt ? row("Resolved", UI.dateTime(t.resolvedAt) + " (took " + UI.minutes(t.resolutionMinutes) + ")") : "") +
        (t.reopenCount ? row("Reopened", t.reopenCount + " time(s)") : "") +
        (t.feedback ? row("Your feedback", t.feedback.rating + "/5 " + UI.esc(t.feedback.comments || "")) : "");
      $("history").innerHTML = history.map(h => '<li class="list-group-item small">' + (h.fromStatus ? UI.statusBadge(h.fromStatus) + " &rarr; " : "") +
        UI.statusBadge(h.toStatus) + '<div>' + UI.esc(h.remark || "") + '</div><div class="text-muted">' + UI.esc(h.changedByName) + ", " + UI.dateTime(h.changedAt) + "</div></li>").join("");
      $("comments").innerHTML = comments.length ? comments.map(c => '<div class="mb-2"><strong>' + UI.esc(c.authorName) +
        ' <span class="badge bg-light text-dark">' + c.authorRole + '</span></strong> <span class="text-muted small">' + UI.dateTime(c.createdAt) +
        "</span><div>" + UI.esc(c.message) + "</div></div>").join("") : '<div class="text-muted small">No comments yet.</div>';
      $("commentForm").classList.toggle("d-none", t.status === "CLOSED");
    } catch (e) { UI.showError("alert", e); }
  }

  Auth.require("STUDENT").then(user => {
    UI.renderNavbar(user);
    if (!id) { UI.alertBox("alert", "danger", "No ticket selected."); return; }
    $("commentBtn").onclick = () => act(async () => {
      await Api.post("/api/tickets/" + id + "/comments", { message: $("commentText").value.trim() });
      $("commentText").value = "";
    });
    load();
  });
</script></body></html>
