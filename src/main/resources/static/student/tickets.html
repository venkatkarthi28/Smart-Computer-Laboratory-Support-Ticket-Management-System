<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tickets - Lab Support</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/app.css" rel="stylesheet"></head><body>
<div id="navbar"></div>
<div class="container pb-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <h3 class="page-title mb-0">My tickets</h3>
    <div class="d-flex gap-2">
      <select id="status" class="form-select"><option value="">All statuses</option>
        <option>OPEN</option><option>ASSIGNED</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option><option>REOPENED</option></select>
      <a class="btn btn-primary text-nowrap" href="/student/create-ticket.html">+ New</a>
    </div>
  </div>
  <div id="alert"></div>
  <div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
    <thead><tr><th>#</th><th>Lab / Computer</th><th>Category</th><th>Priority</th><th>Status</th><th>Technician</th><th>Created</th></tr></thead>
    <tbody id="rows"></tbody></table></div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
      <span class="small text-muted" id="count"></span>
      <div class="btn-group"><button class="btn btn-sm btn-outline-secondary" id="prev">Previous</button>
        <button class="btn btn-sm btn-outline-secondary" id="next">Next</button></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let page = 0, lastPage = true;
  async function load() {
    const q = "page=" + page + "&size=10" + ($("status").value ? "&status=" + $("status").value : "");
    try {
      const p = await Api.get("/api/tickets?" + q);
      lastPage = p.last;
      $("rows").innerHTML = p.content.length ? p.content.map(t =>
        '<tr class="clickable" data-id="' + t.id + '"><td>#' + t.id + "</td><td>" + UI.esc(t.laboratoryName) + " / " + UI.esc(t.computerCode) +
        "</td><td>" + UI.esc(t.categoryName) + "</td><td>" + UI.priorityBadge(t.priorityName) + "</td><td>" + UI.statusBadge(t.status) + UI.slaBadge(t.slaBreached) +
        "</td><td>" + UI.esc(t.assignedTechnicianName || "-") + "</td><td>" + UI.dateTime(t.createdAt) + "</td></tr>").join("")
        : '<tr><td colspan="7" class="text-muted p-3">No tickets found.</td></tr>';
      $("rows").querySelectorAll("tr.clickable").forEach(tr => tr.addEventListener("click",
        () => window.location.href = "/student/ticket-details.html?id=" + tr.dataset.id));
      $("count").textContent = p.totalElements + " ticket(s) - page " + (p.page + 1) + " of " + Math.max(p.totalPages, 1);
      $("prev").disabled = page === 0; $("next").disabled = lastPage;
    } catch (e) { UI.showError("alert", e); }
  }
  Auth.require("STUDENT").then(user => {
    UI.renderNavbar(user);
    $("status").addEventListener("change", () => { page = 0; load(); });
    $("prev").addEventListener("click", () => { page--; load(); });
    $("next").addEventListener("click", () => { page++; load(); });
    load();
  });
</script></body></html>
