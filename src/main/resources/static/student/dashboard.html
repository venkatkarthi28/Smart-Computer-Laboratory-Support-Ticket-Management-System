<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Dashboard - Lab Support</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<div class="container pb-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <h3 class="page-title mb-0" id="welcome">Dashboard</h3>
    <a class="btn btn-primary" href="/student/create-ticket.html"><i class="bi bi-plus-lg me-1"></i>Raise New Ticket</a>
  </div>
  <div id="alert"></div>
  <div id="confirmBanner"></div>
  <div class="row g-3 mb-4" id="stats"></div>
  <div class="card">
    <div class="card-header bg-white fw-semibold">Recent tickets</div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr><th>#</th><th>Computer</th><th>Category</th><th>Priority</th><th>Status</th><th>Created</th></tr></thead>
        <tbody id="recent"><tr><td colspan="6" class="text-muted p-3">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script>
  Auth.require("STUDENT").then(async user => {
    UI.renderNavbar(user);
    document.getElementById("welcome").textContent = "Welcome, " + user.fullName;
    try {
      const d = await Api.get("/api/student/dashboard");
      document.getElementById("stats").innerHTML =
        UI.statCard("Total Tickets", d.totalTickets, "dark") +
        UI.statCard("Pending", d.openTickets + d.assignedTickets, "red") +
        UI.statCard("In Progress", d.inProgressTickets, "orange") +
        UI.statCard("Resolved", d.resolvedTickets, "green") +
        UI.statCard("Closed", d.closedTickets, "gray") +
        UI.statCard("Reopened", d.reopenedTickets, "red");

      const waiting = d.recentTickets.filter(t => t.status === "RESOLVED");
      if (waiting.length || d.resolvedTickets > 0) {
        document.getElementById("confirmBanner").innerHTML =
          '<div class="alert alert-success">' + d.resolvedTickets +
          " ticket(s) were marked resolved by a technician. Open them and confirm whether the problem is solved.</div>";
      }

      const rows = d.recentTickets.map(t =>
        '<tr class="clickable" data-id="' + t.id + '"><td>#' + t.id + "</td><td>" + UI.esc(t.computerCode) +
        "</td><td>" + UI.esc(t.categoryName) + "</td><td>" + UI.priorityBadge(t.priorityName) + "</td><td>" +
        UI.statusBadge(t.status) + UI.slaBadge(t.slaBreached) + "</td><td>" + UI.dateTime(t.createdAt) + "</td></tr>");
      const body = document.getElementById("recent");
      body.innerHTML = rows.length ? rows.join("") :
        '<tr><td colspan="6" class="text-muted p-3">No tickets yet. Click "Raise New Ticket" to create one.</td></tr>';
      body.querySelectorAll("tr.clickable").forEach(tr => tr.addEventListener("click",
        () => window.location.href = "/student/ticket-details.html?id=" + tr.dataset.id));
    } catch (err) { UI.showError("alert", err); }
  });
</script>
</body>
</html>
